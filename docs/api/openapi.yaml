openapi: 3.1.0
info:
  title: Marketplace de alojamientos API
  description: "Contrato REST del backend: autenticacion, perfil de usuario y servicios\
    \ de alojamiento."
  version: v1
servers:
- url: http://localhost:8080
  description: Generated server url
tags:
- name: Reportes
  description: "Reportes de gestión en PDF o Excel, solo para ADMINISTRADOR (SCRUM-53)."
- name: Autenticación
  description: "Registro, inicio de sesión y recuperación de cuenta. Todo público\
    \ (SCRUM-22)."
- name: Servicios adicionales
  description: Extras con precio que ofrece cada publicación (SCRUM-37).
- name: Mi cuenta
  description: Perfil y estado de la cuenta del usuario autenticado (SCRUM-25/26).
- name: Políticas de cancelación
  description: Políticas que el anfitrión asocia a su publicación (SCRUM-42).
- name: Cotizaciones
  description: Cotización de una estancia con desglose de tarifas (SCRUM-36).
- name: Administración de reseñas
  description: Moderación de reseñas por el administrador (SCRUM-50).
- name: Auditoría
  description: "Eventos de log_auditoria, solo para ADMINISTRADOR (SCRUM-51)."
- name: Reseñas
  description: Reseñar una estancia terminada (SCRUM-46).
- name: Servicios
  description: "Catálogo de servicios adicionales de un alojamiento (ej. WiFi, parqueadero)."
- name: Publicaciones
  description: Publicaciones de alojamientos del anfitrión (SCRUM-27).
- name: Reservas
  description: Crear y confirmar una reserva inmediata (SCRUM-38).
- name: Administración de publicaciones
  description: Moderación de publicaciones por el administrador (SCRUM-48).
- name: Búsqueda
  description: Búsqueda pública de alojamientos con filtros (SCRUM-34).
- name: Disponibilidad
  description: Calendario de disponibilidad del anfitrión (SCRUM-31).
- name: Administración de usuarios
  description: Moderación de cuentas por el administrador (SCRUM-49).
- name: Notificaciones
  description: Centro de notificaciones del usuario autenticado (SCRUM-45).
paths:
  /api/users/me:
    get:
      tags:
      - Mi cuenta
      summary: Ver los datos básicos del perfil propio
      operationId: obtenerPerfil
      responses:
        "200":
          description: Perfil del usuario autenticado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PerfilUsuarioResponse"
        "401":
          description: Falta el token o ya venció
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - bearerAuth: []
    put:
      tags:
      - Mi cuenta
      summary: "Actualizar nombre, apellido, correo o teléfono del perfil propio"
      description: "Si el correo cambia, reemite el JWT (el correo es el \"sub\" del\
        \ token)."
      operationId: actualizarPerfil
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActualizarPerfilRequest"
        required: true
      responses:
        "200":
          description: "Perfil actualizado, incluye el token vigente"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PerfilActualizadoResponse"
        "400":
          description: "Nombre, apellido o correo inválidos"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Falta el token o ya venció
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: El correo ya es de otra cuenta
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - bearerAuth: []
  /api/listings/{id}:
    get:
      tags:
      - Publicaciones
      summary: Ver el detalle de un alojamiento
      description: "Para el huésped: publicación ACTIVA con sus reseñas visibles y\
        \ la política de cancelación."
      operationId: obtenerParaHuesped
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: Detalle con reseñas y calificación promedio
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DetalleAlojamientoResponse"
        "401":
          description: Falta el token o ya venció
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: La publicación no existe o ya no está disponible
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - bearerAuth: []
    put:
      tags:
      - Publicaciones
      summary: Editar una publicación
      description: El ANFITRION dueño o un ADMINISTRADOR. El dueño no puede editar
        una publicación BLOQUEADA.
      operationId: editar
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditarPublicacionRequest"
        required: true
      responses:
        "200":
          description: Publicación actualizada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PublicacionResponse"
        "400":
          description: Datos inválidos o servicio inexistente
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Falta el token o ya venció
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: No es el dueño de la publicación ni ADMINISTRADOR
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: La publicación no existe
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: La publicación está BLOQUEADA
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - bearerAuth: []
  /api/listings/{idPublicacion}/extras:
    get:
      tags:
      - Servicios adicionales
      summary: Listar los servicios adicionales activos de una publicación
      operationId: listar
      parameters:
      - name: idPublicacion
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: Servicios adicionales activos
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServicioAdicionalResponse"
        "401":
          description: Falta el token o ya venció
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: La publicación no existe
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - bearerAuth: []
    put:
      tags:
      - Servicios adicionales
      summary: Reemplazar los servicios adicionales de una publicación
      description: Solo el ANFITRION dueño. Los que no vengan en la lista quedan inactivos.
      operationId: guardar
      parameters:
      - name: idPublicacion
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuardarServiciosAdicionalesRequest"
        required: true
      responses:
        "200":
          description: Servicios adicionales activos después del cambio
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServicioAdicionalResponse"
        "400":
          description: "Nombre vacío, precio negativo o nombre repetido"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Falta el token o ya venció
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: No es ANFITRION o la publicación es de otro anfitrión
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: La publicación no existe
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - bearerAuth: []
  /api/listings/{idPublicacion}/availability/{idDisponibilidad}:
    put:
      tags:
      - Disponibilidad
      summary: Modificar un periodo del calendario
      operationId: actualizar
      parameters:
      - name: idPublicacion
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: idDisponibilidad
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuardarDisponibilidadRequest"
        required: true
      responses:
        "200":
          description: Periodo modificado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DisponibilidadResponse"
        "400":
          description: "Fechas invertidas, campos faltantes o periodo RESERVADO"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Falta el token o ya venció
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: No es ANFITRION o la publicación es de otro anfitrión
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: La publicación o el periodo no existen
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Se superpone con otro periodo o con una reserva activa
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - bearerAuth: []
    delete:
      tags:
      - Disponibilidad
      summary: Eliminar un periodo del calendario
      operationId: eliminar
      parameters:
      - name: idPublicacion
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: idDisponibilidad
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "204":
          description: Periodo eliminado
        "400":
          description: El periodo es RESERVADO
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Falta el token o ya venció
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: No es ANFITRION o la publicación es de otro anfitrión
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: La publicación o el periodo no existen
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Hay una reserva activa en esas fechas
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - bearerAuth: []
  /api/servicios:
    get:
      tags:
      - Servicios
      summary: Listar todos los servicios disponibles
      operationId: listar_1
      responses:
        "200":
          description: Lista de servicios
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServicioResponse"
        "401":
          description: Falta el token o ya venció
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - bearerAuth: []
    post:
      tags:
      - Servicios
      summary: Crear un servicio
      description: Solo un ADMINISTRADOR puede crear servicios.
      operationId: crear
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrearServicioRequest"
        required: true
      responses:
        "201":
          description: Servicio creado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ServicioResponse"
        "400":
          description: Nombre vacío
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Falta el token o ya venció
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: El usuario autenticado no es ADMINISTRADOR
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - bearerAuth: []
  /api/reservas:
    post:
      tags:
      - Reservas
      summary: Crear una reserva inmediata
      description: "Revalida fechas, capacidad y disponibilidad, y confirma la reserva\
        \ de inmediato."
      operationId: crear_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrearReservaRequest"
        required: true
      responses:
        "201":
          description: Reserva confirmada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReservaResponse"
        "400":
          description: "Datos inválidos, fechas inválidas, más huéspedes que la capacidad\
            \ o publicación no activa"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Falta el token o ya venció
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: La publicación no existe
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: El periodo ya no está disponible o la publicación requiere
            aprobación del anfitrión
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - bearerAuth: []
  /api/reservas/{idReserva}/resena:
    post:
      tags:
      - Reseñas
      summary: Reseñar una estancia
      description: Calificación de 1 a 5 y comentario opcional.
      operationId: crear_2
      parameters:
      - name: idReserva
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrearResenaRequest"
        required: true
      responses:
        "201":
          description: Reseña creada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResenaResponse"
        "400":
          description: Calificación fuera de 1 a 5 o comentario muy largo
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: La reserva no existe o no es tuya
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: La estancia no ha terminado o ya la reseñaste
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - bearerAuth: []
  /api/quotes:
    post:
      tags:
      - Cotizaciones
      summary: Cotizar una estancia
      description: "Calcula noches, subtotal, limpieza, tarifa de servicio, descuento\
        \ y total. No guarda nada."
      operationId: cotizar
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CotizacionRequest"
        required: true
      responses:
        "200":
          description: Cotización con desglose
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CotizacionResponse"
        "400":
          description: "Fechas inválidas, más huéspedes que la capacidad o publicació\
            n no activa"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Falta el token o ya venció
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: La publicación no existe
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: El periodo no está disponible
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - bearerAuth: []
  /api/listings:
    post:
      tags:
      - Publicaciones
      summary: Crear una publicación
      description: "Solo un ANFITRION. La publicación queda en BORRADOR; si no se\
        \ elige política de cancelación, se usa FLEXIBLE."
      operationId: crear_3
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrearPublicacionRequest"
        required: true
      responses:
        "201":
          description: Publicación creada en BORRADOR
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PublicacionResponse"
        "400":
          description: "Datos inválidos (capacidad, precio, campos obligatorios),\
            \ servicio o política inexistente"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Falta el token o ya venció
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: El usuario autenticado no es ANFITRION
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - bearerAuth: []
  /api/listings/{idPublicacion}/availability:
    post:
      tags:
      - Disponibilidad
      summary: Agregar un periodo al calendario
      description: El anfitrión agrega periodos DISPONIBLE o BLOQUEADO; RESERVADO
        lo pone el sistema al reservar.
      operationId: crear_4
      parameters:
      - name: idPublicacion
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuardarDisponibilidadRequest"
        required: true
      responses:
        "201":
          description: Periodo creado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DisponibilidadResponse"
        "400":
          description: "Fechas invertidas, campos faltantes o estado RESERVADO"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Falta el token o ya venció
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: No es ANFITRION o la publicación es de otro anfitrión
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: La publicación no existe
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Se superpone con otro periodo o con una reserva activa
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - bearerAuth: []
  /api/auth/reset-password:
    post:
      tags:
      - Autenticación
      summary: Cambiar la contraseña con el token del enlace de restablecimiento
      operationId: restablecerContrasena
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestablecerContrasenaRequest"
        required: true
      responses:
        "200":
          description: Contraseña actualizada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MensajeResponse"
        "400":
          description: "Token vencido, inválido o ya usado, o contraseña débil"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/register:
    post:
      tags:
      - Autenticación
      summary: Crear una cuenta como HUESPED o ANFITRION
      operationId: registrar
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrarUsuarioRequest"
        required: true
      responses:
        "201":
          description: Cuenta creada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UsuarioRegistradoResponse"
        "400":
          description: "Datos inválidos: correo mal formado, contraseña débil o rol\
            \ distinto de HUESPED/ANFITRION"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: El correo ya está registrado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/reactivar:
    post:
      tags:
      - Autenticación
      summary: Reactivar una cuenta inactiva con correo y contraseña
      operationId: reactivar
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IniciarSesionRequest"
        required: true
      responses:
        "200":
          description: "Cuenta reactivada, emite el JWT de sesión"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/IniciarSesionResponse"
        "400":
          description: Correo o contraseña con formato inválido
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Correo o contraseña incorrectos
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "La cuenta está restringida, no se puede reactivar sola"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/login:
    post:
      tags:
      - Autenticación
      summary: Iniciar sesión con correo y contraseña
      operationId: iniciarSesion
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IniciarSesionRequest"
        required: true
      responses:
        "200":
          description: "Credenciales correctas, emite el JWT de sesión"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/IniciarSesionResponse"
        "400":
          description: Correo o contraseña con formato inválido
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Correo o contraseña incorrectos
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Cuenta inactiva o restringida
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/forgot-password:
    post:
      tags:
      - Autenticación
      summary: Solicitar el enlace para restablecer la contraseña
      description: "Responde igual exista o no el correo, para no revelar qué cuentas\
        \ están registradas."
      operationId: solicitarRestablecimiento
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolicitarRestablecimientoRequest"
        required: true
      responses:
        "200":
          description: Mensaje genérico de confirmación
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MensajeResponse"
        "400":
          description: Correo con formato inválido
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/users/me/status:
    patch:
      tags:
      - Mi cuenta
      summary: Activar o desactivar la propia cuenta
      operationId: cambiarEstado
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CambiarEstadoCuentaRequest"
        required: true
      responses:
        "200":
          description: Estado actualizado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EstadoCuentaResponse"
        "400":
