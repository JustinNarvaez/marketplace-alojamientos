components:
  schemas:
    ActualizarPerfilRequest:
      type: object
      properties:
        nombre:
          type: string
          minLength: 1
        apellido:
          type: string
          minLength: 1
        correo:
          type: string
          format: email
          minLength: 1
        telefono:
          type:
          - string
          - "null"
      required:
      - apellido
      - correo
      - nombre
    ErrorResponse:
      type: object
      properties:
        mensaje:
          type: string
    PerfilActualizadoResponse:
      type: object
      properties:
        id:
          type: integer
          format: int32
        nombre:
          type: string
        apellido:
          type: string
        correo:
          type: string
        telefono:
          type:
          - string
          - "null"
        roles:
          type: array
          items:
            type: string
        token:
          type: string
    EditarPublicacionRequest:
      type: object
      properties:
        titulo:
          type: string
          maxLength: 150
          minLength: 0
        descripcion:
          type: string
          minLength: 1
        tipoAlojamiento:
          type: string
          enum:
          - CASA
          - APARTAMENTO
          - HABITACION
          - CABANA
          - FINCA
        capacidad:
          type: integer
          format: int32
          maximum: 50
          minimum: 1
        ciudad:
          type: string
          maxLength: 80
          minLength: 0
        direccion:
          type: string
          maxLength: 200
          minLength: 0
