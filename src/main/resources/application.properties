spring.application.name=marketplace-alojamientos

# Base de datos
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/marketplace}
spring.datasource.username=${DB_USER:marketplace}
spring.datasource.password=${DB_PASSWORD:marketplace}

# Flyway es el dueno del esquema. Hibernate solo valida, nunca modifica.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT (SCRUM-22). El secreto de desarrollo NO se usa en produccion: ahi
# siempre se inyecta JWT_SECRET por variable de entorno.
app.jwt.secret=${JWT_SECRET:clave-secreta-de-desarrollo-unbosque-marketplace-no-usar-en-produccion}
app.jwt.expiracion-minutos=${JWT_EXPIRACION_MINUTOS:120}

# AuthService valida contra la base a mano (ver ServicioJwt/FiltroAutenticacionJwt).
# Sin esto, Spring Security autoconfigura un UserDetailsService en memoria
# que no se usa, y genera una contrasena aleatoria en cada arranque.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration