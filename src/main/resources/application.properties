spring.application.name=marketplace-alojamientos

# Base de datos
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/marketplace}
spring.datasource.username=${DB_USER:marketplace}
spring.datasource.password=${DB_PASSWORD:marketplace}

# Flyway es el dueno del esquema. Hibernate solo valida, nunca modifica.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration