spring.application.name=marketplace-alojamientos

# Base de datos
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/marketplace}
spring.datasource.username=${DB_USER:marketplace}
spring.datasource.password=${DB_PASSWORD:marketplace}

# Flyway es el dueno del esquema. Hibernate solo valida, nunca modifica.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT (SCRUM-22). El secreto de desarrollo NO se usa en produccion: ahi
# siempre se inyecta JWT_SECRET por variable de entorno.
app.jwt.secret=${JWT_SECRET:clave-secreta-de-desarrollo-unbosque-marketplace-no-usar-en-produccion}
app.jwt.expiracion-minutos=${JWT_EXPIRACION_MINUTOS:120}

# Vigencia del enlace de "Olvide mi contrasena" (SCRUM-24).
app.jwt.restablecimiento-minutos=${JWT_RESTABLECIMIENTO_MINUTOS:15}

# AuthService valida contra la base a mano (ver ServicioJwt/FiltroAutenticacionJwt).
# Sin esto, Spring Security autoconfigura un UserDetailsService en memoria
# que no se usa, y genera una contrasena aleatoria en cada arranque.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# SCRUM-58: cada linea de log lleva el id de peticion (FiltroIdPeticion),
# asi se pueden buscar por nivel o por peticion.
logging.pattern.level=%5p [%X{idPeticion:-}]

# Cotizacion (SCRUM-36, escenario 2): se cambian aqui o por variable de
# entorno, sin tocar codigo. Porcentajes sobre el subtotal de alojamiento.
app.cotizacion.porcentaje-servicio=${COTIZACION_PORCENTAJE_SERVICIO:10}
app.cotizacion.porcentaje-descuento=${COTIZACION_PORCENTAJE_DESCUENTO:10}
app.cotizacion.noches-para-descuento=${COTIZACION_NOCHES_DESCUENTO:7}
