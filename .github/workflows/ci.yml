name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    name: Compilar, probar y analizar
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: marketplace
          POSTGRES_USER: marketplace
          POSTGRES_PASSWORD: marketplace
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U marketplace -d marketplace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Dar permiso de ejecucion al wrapper
        run: chmod +x ./mvnw

      - name: Compilar y ejecutar las pruebas
        run: ./mvnw --batch-mode clean verify

      - name: Analisis estatico en SonarQube Cloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >-
          ./mvnw --batch-mode
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.organization=justinnarvaez-1
          -Dsonar.projectKey=JustinNarvaez_marketplace-alojamientos
